services:
  mongo_db:
    container_name: mongo_db
    image: mongo:5.0.2
    restart: unless-stopped
    volumes:
      - 'duck-mongo_data:/data/db'
      - 'duck-mongo_config:/data/config'
      - 'duck-mongo_configdb:/data/configdb'
    env_file:
      - .env
    # Uncomment to reach the database from the host (e.g. `npm run dev`).
    # ports:
    #   - '27017:27017'
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - node-network

  duckbot:
    build:
      context: .
    image: duckbot
    container_name: duckbot
    volumes:
      - .:/app
      - duck-node_modules:/app/node_modules
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - node-network
    env_file:
      - .env
    depends_on:
      mongo_db:
        condition: service_healthy

networks:
  node-network:
    driver: bridge

volumes:
  duck-mongo_data:
  duck-mongo_config:
  duck-mongo_configdb:
  duck-node_modules:
